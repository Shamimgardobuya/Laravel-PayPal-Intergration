[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"

[program:cache-config]
command=php /var/www/html/payment_app/artisan config:cache
autostart=true
autorestart=false
startsecs=0
priority=1



[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/payment_app/artisan queue:listen --sleep=3 --tries=3
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/worker.log
stderr_logfile=/var/log/worker_error.log

[program:storage-link]
command=php /var/www/html/payment_app/artisan storage:link
autostart=true
autorestart=false
startsecs=0
priority=1

