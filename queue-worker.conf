[supervisord]
nodaemon=true
user=www-data


[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stdout_logfile=/var/log/fpm-out.log
stderr_logfile=/var/log/fpm-err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log


[program:cache-config]
command=php /var/www/artisan config:cache
autostart=true
autorestart=false
priority=1

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
loglevel=info
stdout_logfile=/var/log/worker.log
stderr_logfile=/var/log/worker_error.log

[program:storage-link]
command=php /var/www/artisan storage:link
autostart=true
autorestart=false
startsecs=0
priority=1


[program:run-migrations]
command=php /var/www/artisan migrate --force
autostart=true
autorestart=false
startsecs=0
priority=1

