databases:
  - name: little_lions_junior_db
    plan: free
    databaseName: little_lions_junior_db
    user: little_lions_junior_db

services:
  - type: web
    plan: free
    name: little_lions_junior
    runtime: docker
    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: little_lions_junior_db
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      # Laravel
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: WEBROOT
        value: /var/www/html/public
      - key: REAL_IP_HEADER
        value: 1
      - key: SKIP_COMPOSER
        value: 1